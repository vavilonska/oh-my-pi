name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:
    inputs:
      language:
        description: 'Scan all languages or only the manually built Swift bridge'
        type: choice
        options: [all, swift]
        default: all
permissions:
  contents: read
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'xcode-27' || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.language == 'swift' && '["swift"]' || '["actions","go","javascript-typescript","python","rust","swift"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'swift' && 'manual' || matrix.language == 'go' && 'autobuild' || 'none' }}
          dependency-caching: true
      - name: Resolve Go environment
        if: matrix.language == 'go'
        id: resolve-go
        uses: github/codeql-action/resolve-environment@v4
        with:
          language: go
      - name: Setup Go
        if: matrix.language == 'go' && fromJSON(steps.resolve-go.outputs.environment).configuration.go.version
        uses: actions/setup-go@v6
        with:
          go-version: ${{ fromJSON(steps.resolve-go.outputs.environment).configuration.go.version }}
          cache: false
      - name: Build Go
        if: matrix.language == 'go'
        uses: github/codeql-action/autobuild@v4
      # The standalone bridge has no Swift package/Xcode project. Use the free
      # arm64 Xcode 27 runner and the real SDK build, never the no-toolchain stub.
      - name: Build the Foundation Models Swift bridge
        if: matrix.language == 'swift'
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(bash crates/pi-natives/src/applefm/build-bridge.sh detect)"
          test -n "$toolchain"
          IFS=$'\t' read -r swiftc sdk fingerprint <<< "$toolchain"
          printf '%s\n' "$fingerprint"
          test "$(uname -m)" = arm64
          bash crates/pi-natives/src/applefm/build-bridge.sh build "$RUNNER_TEMP/libomp_applefm.dylib" arm64 "$swiftc" "$sdk"
          test -s "$RUNNER_TEMP/libomp_applefm.dylib"
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
